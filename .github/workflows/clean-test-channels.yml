name: Clean up test RTDB channels

on:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm install -g firebase-tools
      - name: Write service account credentials
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/gcp-key.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLOCKSANDDICE_1B45C }}
      - name: Remove channels marked test
        run: ./scripts/clean-test-channels.sh
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-channel-backups
          path: test-channel-backups/
          if-no-files-found: ignore
          retention-days: 90
