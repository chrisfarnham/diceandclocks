# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: extractions/setup-just@v2
      - run: |
          curl -sSL https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein -o /usr/local/bin/lein
          chmod +x /usr/local/bin/lein
          lein version
      - name: Fetch clock images from production
        run: |
          mkdir -p resources/public/images/clocks
          grep -oE '"[A-Za-z0-9]+\.png"' src/dice_and_clocks/clocks.cljs \
            | tr -d '"' | sort -u \
            | while read -r f; do
                curl -sf -o "resources/public/images/clocks/$f" \
                  "https://clocksanddice-1b45c.web.app/images/clocks/$f"
              done
      - run: npm install
      - run: just ci
      - name: Test Summary
        uses: test-summary/action@v2
        with:
          paths: "${{ github.workspace }}/target/junit/karma/*.xml"
        if: always()
      - run: just release
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLOCKSANDDICE_1B45C }}
          channelId: live
          projectId: clocksanddice-1b45c
